version: "2"

linters:
  default: standard
  enable:
    - unconvert
    - unparam
  settings:
    govet:
      disable:
        - fieldalignment  # Too noisy for existing codebase, fix incrementally
    staticcheck:
      checks:
        - all
        - "-ST1000"  # Package comments — add incrementally
        - "-QF1003"  # Tagged switch suggestions — stylistic
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - (io.Closer).Close
        - (*os/exec.Cmd).Run
        - os.Remove
        - os.Hostname
        - (*bufio.Writer).Flush
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # misspell: "cancelled" is intentional user-facing text in some places
      - linters:
          - misspell
        text: "`(cancelled|Cancelled|signalled)` is a misspelling"

formatters:
  enable:
    - gofmt
    - goimports
